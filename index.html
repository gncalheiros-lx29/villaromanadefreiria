3, 17-07-1990), projecto 2017 a 2019, custo elegível 256 136,69 €, FEDER 128 068,34 €.",u:"https://www.cascais.pt/requalificacao-da-villa-romana-de-freiria"},{id:2,t:"Cascais Cultura, «Villa Romana de Freiria», património arqueológico (consultada em 10-09-2026): morada Rua da Freiria, Polima; georreferenciação 38.720901, -9.323144; IIP, Decreto n.º 29/90, de 17 de Julho; Vergílio Correia (1912), Guilherme Cardoso (início dos anos 80), escavações desde 1985 com José d’Encarnação, ara a Triborunnis, Titus Curiacius Rufino (grafia da página), mosaicos do século IV, «maior celeiro da Península Ibérica», apoio Lisbo@2020, abertura em 22-09-2018; percurso de cerca de 40 min em passadiço, sinalética bilingue, reconstituições de edifícios, cobertura de madeira com balcão; peças no Museu da Vila e em depósitos arqueológicos; visita livre 10h00 às 18h00, telefone 800 203 186; liga a monografia «Estudo arqueológico da villa romana de Freiria», de Guilherme Cardoso.",u:"https://cultura.cascais.pt/list/patrimonio/villa-romana-de-freiria-patrimonio-arqueologico"},{id:3,t:"Câmara Municipal de Cascais, notícia «Musealização do Mosaico da Villa Romana de Freiria», 14-04-2026: inauguração a 10 de Abril de 2026, mosaico descoberto em 1986, três dos quatro tapetes visíveis.",u:"https://www.cascais.pt/noticia/musealizacao-do-mosaico-da-villa-romana-de-freiria"},{id:4,t:"Câmara Municipal de Cascais, notícia «Vila Romana de Freiria: classificação foi há 30 anos», 17-07-2020: aniversário da classificação, parque interpretativo aberto em 2018, congresso de 2018 coordenado por José d’Encarnação.",u:"https://www.cascais.pt/noticia/vila-romana-de-freiria-classificacao-foi-ha-30-anos"},{id:5,t:"Duas Linhas, «Villa Romana de Freiria», 17-01-2026: musealização do triclinium em curso, mosaicos parcialmente destruídos por séculos de lavoura, parte norte preservada, abrigo de madeira com telhado de duas águas sem paredes.",u:"https://duaslinhas.pt/2026/01/villa-romana-de-freiria/"},{id:6,t:"Aviso n.º 16203/2010, Diário da República 2.ª série n.º 157, 13 de Agosto de 2010: Regulamento do Plano de Pormenor do Espaço de Reestruturação Urbanística e Valorização Patrimonial da Área Envolvente à Villa Romana de Freiria (Art.º 2.º, 16.º, 21.º, 25.º, 34.º a 41.º, 44.º).",u:"https://www.cascais.pt/sites/default/files/anexos/gerais/new/regulamento_16.pdf"},{id:7,t:"Câmara Municipal de Cascais, página do Plano de Pormenor: área de cerca de 585 960,609 m², limites (CM 1338 e Polima a norte, EM 584 e Outeiro de Polima a sul, zona industrial da Abóboda a poente), aprovação em 24-06-2010 e publicação a 13-08-2010.",u:"https://www.cascais.pt/sub-area/plano-de-pormenor-do-espaco-de-reestruturacao-urbanistica-e-valorizacao-patrimonial-da-area"},{id:8,t:"PD.01 (Planta de Implantação/Síntese, DXF) e PD.01a_R01 (quadro de valores parciais da UE4): geometria dos lotes 270 a 286, polígonos de implantação, áreas, implantação e superfície de pavimento. Projecto de Arquitectura Paisagista da UE4, Junho de 2017: árvores de arruamento.",u:c},{id:9,t:"Wikipedia (EN), «Roman villa of Freiria» (consultada em 10-09-2026), fonte secundária: primeiras escavações em 1973 por Guilherme Cardoso e José d’Encarnação; identificação como villa em 1985; trabalhos entre 1985 e 2002; nova campanha a partir de 13-07-1987; construção da villa no século II e declínio no século V. Cita a ficha SIPA (Paula Noé, 1994), Cardoso e d’Encarnação, «Villa Romana de Freiria», Informação Arqueológica (1994), e Cardoso (2018). Não verificada nas fontes primárias.",u:"https://en.wikipedia.org/wiki/Roman_villa_of_Freiria"},{id:10,t:"Cascais Ambiente, «Parque Urbano Outeiro de Polima» (consultada em 10-09-2026): junto à Estrada de Polima, S. Domingos de Rana, 5 ha, coordenadas 38.712652, -9.32634; relvados, campos de jogos, cafetaria, hortas comunitárias, circuito de manutenção. Não refere a Villa nem o Plano.",u:"https://ambiente.cascais.pt/pt/espacos/parques-jardins/parque-urbano-outeiro-polima"},{id:11,t:"Engistep, en
